<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" role="img" aria-label="LoRA の低ランク分解の図">
  <rect width="760" height="250" fill="#ffffff"/>

  <text x="20" y="28" font-size="13" fill="#15232E" font-weight="bold">h = W₀ x ＋ (α / r) · B A x</text>

  <!-- W0 -->
  <rect x="30" y="60" width="140" height="140" rx="4" fill="#E3EDFB" stroke="#1E6FD9"/>
  <text x="100" y="124" font-size="14" fill="#1E6FD9" text-anchor="middle">W₀</text>
  <text x="100" y="142" font-size="11" fill="#1E6FD9" text-anchor="middle">d × k（凍結）</text>
  <text x="100" y="222" font-size="11" fill="#6B7A86" text-anchor="middle">k</text>
  <text x="18" y="134" font-size="11" fill="#6B7A86" text-anchor="middle">d</text>

  <text x="196" y="136" font-size="18" fill="#3D4E5C" text-anchor="middle">+</text>

  <!-- B -->
  <rect x="222" y="60" width="24" height="140" rx="3" fill="#FCEFE7" stroke="#E0662C"/>
  <text x="234" y="134" font-size="13" fill="#E0662C" text-anchor="middle">B</text>
  <text x="234" y="222" font-size="11" fill="#6B7A86" text-anchor="middle">r</text>
  <text x="234" y="52" font-size="10" fill="#E0662C" text-anchor="middle">d × r</text>

  <text x="264" y="136" font-size="16" fill="#3D4E5C" text-anchor="middle">×</text>

  <!-- A -->
  <rect x="282" y="118" width="140" height="24" rx="3" fill="#FCEFE7" stroke="#E0662C"/>
  <text x="352" y="135" font-size="13" fill="#E0662C" text-anchor="middle">A</text>
  <text x="352" y="164" font-size="11" fill="#6B7A86" text-anchor="middle">k</text>
  <text x="434" y="134" font-size="11" fill="#6B7A86" text-anchor="middle">r</text>
  <text x="352" y="108" font-size="10" fill="#E0662C" text-anchor="middle">r × k</text>
  <text x="352" y="192" font-size="11" fill="#E0662C" text-anchor="middle">B, A のみ学習（r ≪ min(d, k)）</text>

  <line x1="470" y1="40" x2="470" y2="230" stroke="#D4DCE2" stroke-dasharray="4 4"/>

  <!-- 右: 数値 -->
  <text x="490" y="64" font-size="12" fill="#15232E" font-weight="bold">学習パラメータ数（1 層あたり）</text>
  <text x="490" y="86" font-size="11" fill="#3D4E5C">フル：d · k</text>
  <text x="490" y="104" font-size="11" fill="#3D4E5C">LoRA：r · (d + k)</text>
  <text x="490" y="130" font-size="11" fill="#3D4E5C">例：d = k = 4096, r = 8</text>
  <text x="490" y="148" font-size="11" fill="#3D4E5C">1680 万 → 6.5 万（約 0.4%）</text>
  <text x="490" y="180" font-size="11" fill="#3D4E5C">・初期化：A は乱数、B は 0 → 開始時 ΔW = 0</text>
  <text x="490" y="198" font-size="11" fill="#3D4E5C">・推論時：W₀ + BA を合成すれば追加コストなし</text>
  <text x="490" y="216" font-size="11" fill="#3D4E5C">・アダプタは数十 MB。差し替えて使える</text>
</svg>
