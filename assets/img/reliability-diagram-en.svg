<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Reliability diagram: an overconfident model's curve sits below the diagonal">
  <rect width="680" height="330" fill="#ffffff"/>
  <line x1="90" y1="270" x2="560" y2="270" stroke="#3D4E5C" stroke-width="1.5"/>
  <line x1="90" y1="270" x2="90" y2="40" stroke="#3D4E5C" stroke-width="1.5"/>
  <text x="325" y="308" font-size="13" fill="#1E6FD9" text-anchor="middle">Model confidence</text>
  <text x="34" y="160" font-size="13" fill="#E0662C" text-anchor="middle" transform="rotate(-90 34 160)">Actual accuracy</text>
  <text x="90" y="288" font-size="11" fill="#6B7A86" text-anchor="middle">0.0</text>
  <text x="325" y="288" font-size="11" fill="#6B7A86" text-anchor="middle">0.5</text>
  <text x="560" y="288" font-size="11" fill="#6B7A86" text-anchor="middle">1.0</text>
  <text x="76" y="274" font-size="11" fill="#6B7A86" text-anchor="end">0.0</text>
  <text x="76" y="159" font-size="11" fill="#6B7A86" text-anchor="end">0.5</text>
  <text x="76" y="48" font-size="11" fill="#6B7A86" text-anchor="end">1.0</text>
  <line x1="90" y1="270" x2="560" y2="44" stroke="#9AAAB6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="405" y="120" font-size="12" fill="#6B7A86">Ideal (y = x)</text>
  <polyline points="137,255 184,244 231,231 278,215 325,196 372,175 419,152 466,128 513,105 553,86" fill="none" stroke="#E0662C" stroke-width="2.5"/>
  <circle cx="325" cy="196" r="4" fill="#E0662C"/>
  <circle cx="466" cy="128" r="4" fill="#E0662C"/>
  <circle cx="553" cy="86" r="4" fill="#E0662C"/>
  <text x="428" y="205" font-size="12" fill="#E0662C">Overconfident model</text>
  <line x1="553" y1="86" x2="553" y2="48" stroke="#E0662C" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="566" y="70" font-size="11" fill="#E0662C">gap</text>
  <text x="120" y="60" font-size="12" fill="#3D4E5C">Predictions claiming confidence 0.95</text>
  <text x="120" y="78" font-size="12" fill="#3D4E5C">are actually only 0.82 accurate —</text>
  <text x="120" y="96" font-size="12" fill="#3D4E5C">a typical overconfidence pattern</text>
</svg>
