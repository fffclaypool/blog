<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" role="img" aria-label="Attention計算の行列演算フロー図">
  <rect width="680" height="260" fill="#ffffff"/>
  <rect x="30" y="40" width="90" height="120" rx="6" fill="#E3EDFB" stroke="#1E6FD9" stroke-width="1.5"/>
  <text x="75" y="105" font-size="15" fill="#1E6FD9" text-anchor="middle" font-weight="bold">Q</text>
  <text x="75" y="178" font-size="11" fill="#6B7A86" text-anchor="middle">n × d_k</text>
  <rect x="150" y="60" width="120" height="80" rx="6" fill="#DFF2EC" stroke="#0F8A6D" stroke-width="1.5"/>
  <text x="210" y="105" font-size="15" fill="#0F8A6D" text-anchor="middle" font-weight="bold">Kᵀ</text>
  <text x="210" y="158" font-size="11" fill="#6B7A86" text-anchor="middle">d_k × n</text>
  <text x="292" y="106" font-size="16" fill="#3D4E5C" text-anchor="middle">→</text>
  <rect x="316" y="40" width="120" height="120" rx="6" fill="#ffffff" stroke="#3D4E5C" stroke-width="1.5"/>
  <rect x="322" y="46" width="26" height="26" fill="#1E6FD9" opacity="0.85"/>
  <rect x="350" y="46" width="26" height="26" fill="#1E6FD9" opacity="0.25"/>
  <rect x="378" y="46" width="26" height="26" fill="#1E6FD9" opacity="0.12"/>
  <rect x="406" y="46" width="26" height="26" fill="#1E6FD9" opacity="0.45"/>
  <rect x="322" y="74" width="26" height="26" fill="#1E6FD9" opacity="0.18"/>
  <rect x="350" y="74" width="26" height="26" fill="#1E6FD9" opacity="0.7"/>
  <rect x="378" y="74" width="26" height="26" fill="#1E6FD9" opacity="0.5"/>
  <rect x="406" y="74" width="26" height="26" fill="#1E6FD9" opacity="0.1"/>
  <rect x="322" y="102" width="26" height="26" fill="#1E6FD9" opacity="0.3"/>
  <rect x="350" y="102" width="26" height="26" fill="#1E6FD9" opacity="0.2"/>
  <rect x="378" y="102" width="26" height="26" fill="#1E6FD9" opacity="0.9"/>
  <rect x="406" y="102" width="26" height="26" fill="#1E6FD9" opacity="0.15"/>
  <rect x="322" y="130" width="26" height="26" fill="#1E6FD9" opacity="0.1"/>
  <rect x="350" y="130" width="26" height="26" fill="#1E6FD9" opacity="0.35"/>
  <rect x="378" y="130" width="26" height="26" fill="#1E6FD9" opacity="0.3"/>
  <rect x="406" y="130" width="26" height="26" fill="#1E6FD9" opacity="0.75"/>
  <text x="376" y="182" font-size="11" fill="#6B7A86" text-anchor="middle">A = softmax(QKᵀ/√d_k)</text>
  <text x="376" y="200" font-size="11" fill="#6B7A86" text-anchor="middle">n × n（各行の合計 = 1）</text>
  <text x="466" y="106" font-size="16" fill="#3D4E5C" text-anchor="middle">×</text>
  <rect x="490" y="40" width="80" height="120" rx="6" fill="#FBEADF" stroke="#E0662C" stroke-width="1.5"/>
  <text x="530" y="105" font-size="15" fill="#E0662C" text-anchor="middle" font-weight="bold">V</text>
  <text x="530" y="178" font-size="11" fill="#6B7A86" text-anchor="middle">n × d_v</text>
  <text x="594" y="106" font-size="16" fill="#3D4E5C" text-anchor="middle">=</text>
  <rect x="614" y="40" width="46" height="120" rx="6" fill="#EEF2F5" stroke="#3D4E5C"/>
  <text x="637" y="105" font-size="11" fill="#15232E" text-anchor="middle">out</text>
  <text x="637" y="178" font-size="11" fill="#6B7A86" text-anchor="middle">n × d_v</text>
  <text x="30" y="240" font-size="12" fill="#6B7A86">中央の n×n 行列がAttention重み。第 i 行がトークン i の「どこを見るか」の確率分布になっている。</text>
</svg>
