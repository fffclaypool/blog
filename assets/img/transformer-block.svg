<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" role="img" aria-label="Transformerブロックの構造図">
  <rect width="680" height="300" fill="#ffffff"/>
  <rect x="40" y="240" width="180" height="34" rx="6" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="130" y="262" font-size="13" fill="#15232E" text-anchor="middle">X（n×d）</text>
  <rect x="40" y="150" width="180" height="52" rx="6" fill="#E3EDFB" stroke="#1E6FD9" stroke-width="1.5"/>
  <text x="130" y="172" font-size="13" fill="#1E6FD9" text-anchor="middle" font-weight="bold">Multi-Head Attention</text>
  <text x="130" y="190" font-size="11" fill="#3D4E5C" text-anchor="middle">トークン間で混ぜる（行方向）</text>
  <rect x="40" y="60" width="180" height="52" rx="6" fill="#FBEADF" stroke="#E0662C" stroke-width="1.5"/>
  <text x="130" y="82" font-size="13" fill="#E0662C" text-anchor="middle" font-weight="bold">FFN</text>
  <text x="130" y="100" font-size="11" fill="#3D4E5C" text-anchor="middle">トークン内で変換（列方向）</text>
  <line x1="130" y1="240" x2="130" y2="206" stroke="#3D4E5C" stroke-width="1.5"/>
  <polygon points="130,202 125,211 135,211" fill="#3D4E5C"/>
  <line x1="130" y1="150" x2="130" y2="116" stroke="#3D4E5C" stroke-width="1.5"/>
  <polygon points="130,112 125,121 135,121" fill="#3D4E5C"/>
  <line x1="130" y1="60" x2="130" y2="34" stroke="#3D4E5C" stroke-width="1.5"/>
  <polygon points="130,30 125,39 135,39" fill="#3D4E5C"/>
  <text x="130" y="20" font-size="12" fill="#6B7A86" text-anchor="middle">出力（同じ形 n×d）</text>
  <path d="M 220 257 C 262 257 262 176 220 176" fill="none" stroke="#9AAAB6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 220 133 C 262 133 262 86 220 86" fill="none" stroke="#9AAAB6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="272" y="180" font-size="11" fill="#6B7A86">残差接続 + LayerNorm</text>
  <text x="420" y="52" font-size="12" fill="#6B7A86">X の見方（n=4, d=6 の例）</text>
  <rect x="420" y="66" width="192" height="128" fill="#ffffff" stroke="#D4DCE2"/>
  <line x1="420" y1="98" x2="612" y2="98" stroke="#E5EAEE"/>
  <line x1="420" y1="130" x2="612" y2="130" stroke="#E5EAEE"/>
  <line x1="420" y1="162" x2="612" y2="162" stroke="#E5EAEE"/>
  <rect x="420" y="98" width="192" height="32" fill="#E3EDFB"/>
  <text x="516" y="118" font-size="11" fill="#1E6FD9" text-anchor="middle">行 = 1トークンの表現（d次元）</text>
  <text x="420" y="216" font-size="11" fill="#3D4E5C">Attention: 行どうしを混ぜる</text>
  <text x="420" y="236" font-size="11" fill="#3D4E5C">FFN: 各行を独立に変換する</text>
</svg>
