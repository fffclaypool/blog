<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" role="img" aria-label="RAG・LoRA・フルファインチューニングが介入する場所の比較図">
  <rect width="720" height="300" fill="#ffffff"/>

  <!-- 左: RAG -->
  <text x="20" y="26" font-size="13" fill="#15232E" font-weight="bold">RAG</text>
  <rect x="20" y="44" width="70" height="30" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="55" y="64" font-size="12" fill="#15232E" text-anchor="middle">質問 x</text>
  <line x1="90" y1="59" x2="118" y2="59" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="118,59 110,55 110,63" fill="#6B7A86"/>
  <rect x="122" y="44" width="98" height="30" rx="4" fill="#FCEFE7" stroke="#E0662C"/>
  <text x="171" y="64" font-size="12" fill="#E0662C" text-anchor="middle">検索器</text>
  <rect x="122" y="90" width="98" height="26" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="171" y="107" font-size="11" fill="#15232E" text-anchor="middle">文書の索引</text>
  <line x1="171" y1="90" x2="171" y2="78" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="171,74 167,82 175,82" fill="#6B7A86"/>
  <line x1="55" y1="74" x2="55" y2="126" stroke="#6B7A86" stroke-width="1.5"/>
  <line x1="220" y1="59" x2="232" y2="59" stroke="#6B7A86" stroke-width="1.5"/>
  <line x1="232" y1="59" x2="232" y2="120" stroke="#6B7A86" stroke-width="1.5"/>
  <line x1="232" y1="120" x2="120" y2="120" stroke="#6B7A86" stroke-width="1.5"/>
  <line x1="120" y1="120" x2="120" y2="126" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="120,130 116,122 124,122" fill="#6B7A86"/>
  <polygon points="55,130 51,122 59,122" fill="#6B7A86"/>
  <rect x="20" y="132" width="200" height="30" rx="4" fill="#FCEFE7" stroke="#E0662C"/>
  <text x="120" y="152" font-size="11" fill="#E0662C" text-anchor="middle">プロンプト = x ＋ 上位 k 件</text>
  <line x1="120" y1="162" x2="120" y2="182" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="120,186 116,178 124,178" fill="#6B7A86"/>
  <rect x="60" y="188" width="120" height="34" rx="4" fill="#E3EDFB" stroke="#1E6FD9"/>
  <text x="120" y="209" font-size="12" fill="#1E6FD9" text-anchor="middle">LLM（凍結）</text>
  <line x1="120" y1="222" x2="120" y2="240" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="120,244 116,236 124,236" fill="#6B7A86"/>
  <rect x="85" y="246" width="70" height="26" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="120" y="263" font-size="11" fill="#15232E" text-anchor="middle">回答 y</text>
  <text x="120" y="292" font-size="11" fill="#3D4E5C" text-anchor="middle" font-weight="bold">変えるもの：入力</text>

  <line x1="250" y1="20" x2="250" y2="298" stroke="#D4DCE2" stroke-dasharray="4 4"/>

  <!-- 中: LoRA -->
  <text x="270" y="26" font-size="13" fill="#15232E" font-weight="bold">LoRA（低ランク適応）</text>
  <rect x="325" y="44" width="70" height="30" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="360" y="64" font-size="12" fill="#15232E" text-anchor="middle">質問 x</text>
  <line x1="360" y1="74" x2="360" y2="94" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="360,98 356,90 364,90" fill="#6B7A86"/>
  <rect x="270" y="100" width="180" height="120" rx="4" fill="#ffffff" stroke="#1E6FD9"/>
  <text x="360" y="116" font-size="11" fill="#1E6FD9" text-anchor="middle">LLM</text>
  <rect x="282" y="124" width="92" height="84" rx="3" fill="#E3EDFB" stroke="#1E6FD9"/>
  <text x="328" y="162" font-size="12" fill="#1E6FD9" text-anchor="middle">W₀</text>
  <text x="328" y="178" font-size="10" fill="#1E6FD9" text-anchor="middle">凍結</text>
  <text x="386" y="170" font-size="14" fill="#3D4E5C" text-anchor="middle">+</text>
  <rect x="398" y="140" width="40" height="52" rx="3" fill="#FCEFE7" stroke="#E0662C"/>
  <text x="418" y="162" font-size="12" fill="#E0662C" text-anchor="middle">B·A</text>
  <text x="418" y="178" font-size="9" fill="#E0662C" text-anchor="middle">学習</text>
  <text x="418" y="204" font-size="9" fill="#6B7A86" text-anchor="middle">r ≪ d, k</text>
  <line x1="360" y1="220" x2="360" y2="240" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="360,244 356,236 364,236" fill="#6B7A86"/>
  <rect x="325" y="246" width="70" height="26" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="360" y="263" font-size="11" fill="#15232E" text-anchor="middle">回答 y</text>
  <text x="360" y="292" font-size="11" fill="#3D4E5C" text-anchor="middle" font-weight="bold">変えるもの：少数の追加重み</text>

  <line x1="480" y1="20" x2="480" y2="298" stroke="#D4DCE2" stroke-dasharray="4 4"/>

  <!-- 右: フルファインチューニング -->
  <text x="500" y="26" font-size="13" fill="#15232E" font-weight="bold">フルファインチューニング</text>
  <rect x="565" y="44" width="70" height="30" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="600" y="64" font-size="12" fill="#15232E" text-anchor="middle">質問 x</text>
  <line x1="600" y1="74" x2="600" y2="94" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="600,98 596,90 604,90" fill="#6B7A86"/>
  <rect x="510" y="100" width="180" height="120" rx="4" fill="#FCEFE7" stroke="#E0662C"/>
  <text x="600" y="116" font-size="11" fill="#E0662C" text-anchor="middle">LLM</text>
  <text x="600" y="158" font-size="12" fill="#E0662C" text-anchor="middle">θ 全体を更新</text>
  <text x="600" y="178" font-size="10" fill="#E0662C" text-anchor="middle">重み・勾配・最適化器で</text>
  <text x="600" y="192" font-size="10" fill="#E0662C" text-anchor="middle">約 16 バイト / パラメータ</text>
  <line x1="600" y1="220" x2="600" y2="240" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="600,244 596,236 604,236" fill="#6B7A86"/>
  <rect x="565" y="246" width="70" height="26" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="600" y="263" font-size="11" fill="#15232E" text-anchor="middle">回答 y</text>
  <text x="600" y="292" font-size="11" fill="#3D4E5C" text-anchor="middle" font-weight="bold">変えるもの：全重み</text>
</svg>
