<svg viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" role="img" aria-label="ロジットからソフトマックスへの変換図">
  <rect width="680" height="210" fill="#ffffff"/>
  <text x="70" y="24" font-size="12" fill="#6B7A86">logits z（任意の実数）</text>
  <rect x="30" y="40" width="140" height="30" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="100" y="60" font-size="13" fill="#15232E" text-anchor="middle">z1 = 4.2</text>
  <rect x="30" y="80" width="140" height="30" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="100" y="100" font-size="13" fill="#15232E" text-anchor="middle">z2 = 1.2</text>
  <rect x="30" y="120" width="140" height="30" rx="4" fill="#EEF2F5" stroke="#D4DCE2"/>
  <text x="100" y="140" font-size="13" fill="#15232E" text-anchor="middle">z3 = 0.1</text>
  <line x1="190" y1="95" x2="270" y2="95" stroke="#6B7A86" stroke-width="1.5"/>
  <polygon points="270,95 261,90 261,100" fill="#6B7A86"/>
  <text x="230" y="82" font-size="12" fill="#6B7A86" text-anchor="middle">softmax</text>
  <text x="330" y="24" font-size="12" fill="#6B7A86">「確率」p（合計 = 1）</text>
  <rect x="290" y="40" width="188" height="30" rx="4" fill="#E3EDFB" stroke="#1E6FD9"/>
  <text x="384" y="60" font-size="13" fill="#1E6FD9" text-anchor="middle" font-weight="bold">p1 = 0.940</text>
  <rect x="290" y="80" width="70" height="30" rx="4" fill="#E3EDFB" stroke="#A9C6EE"/>
  <text x="325" y="100" font-size="12" fill="#3D4E5C" text-anchor="middle">0.045</text>
  <rect x="290" y="120" width="46" height="30" rx="4" fill="#E3EDFB" stroke="#A9C6EE"/>
  <text x="313" y="140" font-size="12" fill="#3D4E5C" text-anchor="middle">0.015</text>
  <line x1="510" y1="40" x2="510" y2="150" stroke="#D4DCE2" stroke-dasharray="4 4"/>
  <text x="530" y="66" font-size="12" fill="#3D4E5C">保存されるもの:</text>
  <text x="530" y="88" font-size="12" fill="#15232E">スコアの順位と差</text>
  <text x="530" y="118" font-size="12" fill="#3D4E5C">保証されないもの:</text>
  <text x="530" y="140" font-size="12" fill="#E0662C">頻度としての正しさ</text>
  <text x="30" y="190" font-size="12" fill="#6B7A86">z 全体に定数を足しても p は不変（平行移動不変性）。p はロジットの「差」だけで決まる。</text>
</svg>
